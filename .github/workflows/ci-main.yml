    if: ${{ always() }}
    needs: [plan, velnor-lane-admission, policy, github-gradle, velnor-gradle, github-gradle-buildsrc, velnor-gradle-buildsrc, github-gradle-idea-conventions, velnor-gradle-idea-conventions, github-gradle-java-conventions, velnor-gradle-java-conventions, github-gradle-junit-conventions, velnor-gradle-junit-conventions, github-gradle-kotlin-conventions, velnor-gradle-kotlin-conventions, github-gradle-maven-publish-conventions, velnor-gradle-maven-publish-conventions, github-gradle-signing-conventions, velnor-gradle-signing-conventions, github-gradle-sonarqube-conventions, velnor-gradle-sonarqube-conventions, github-gradle-spotless-conventions, velnor-gradle-spotless-conventions, github-gradle-versions-conventions, velnor-gradle-versions-conventions]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate generated stack results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELECTED_UNITS: ${{ needs.plan.outputs.units }}
